name: Django CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'security/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked Python dependencies
        run: |
          set +e
          python -m pip install --require-hashes -r requirements.lock > /tmp/pip-install.log 2>&1
          status=$?
          cat /tmp/pip-install.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 20 /tmp/pip-install.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Locked dependency installation failed::$message"
          fi
          exit "$status"

      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db|' .env
          sed -i 's|^DJANGO_DEBUG=.*|DJANGO_DEBUG=False|' .env
          sed -i 's|^SECRET_KEY=.*|SECRET_KEY=ci-secret-key-for-tests-only-abcdefghijklmnopqrstuvwxyz-1234567890|' .env
          sed -i 's|^JWT_SIGNING_KEY=.*|JWT_SIGNING_KEY=ci-jwt-signing-key-only-abcdefghijklmnopqrstuvwxyz-1234567890|' .env
          sed -i 's|^MEDIA_FILESYSTEM_PERSISTENT=.*|MEDIA_FILESYSTEM_PERSISTENT=True|' .env
          sed -i 's|^MEDIA_ROOT=.*|MEDIA_ROOT=/tmp/gestio-stock-media|' .env

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate production settings
        run: python manage.py check --deploy

      - name: Validate static assets
        run: python manage.py collectstatic --noinput

      - name: Compile Python sources
        run: python -m compileall -q apps gestio_stock

      - name: Validate OpenAPI contract
        run: python manage.py spectacular --file /tmp/openapi.yaml --validate

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity=2
        env:
          SECURE_SSL_REDIRECT: "False"
          SESSION_COOKIE_SECURE: "False"
          CSRF_COOKIE_SECURE: "False"
          ALLOWED_HOSTS: "localhost 127.0.0.1 testserver"

      - name: Audit dependencies
        run: |
          pip install pip-audit==2.9.0
          python -m pip_audit -r requirements.lock
