openapi: 3.0.3
info:
  title: El Amine ERP API
  version: 1.0.0
  description: API REST versionnée pour les clients mobiles autorisés.
paths:
  /api/v1/alerts/:
    get:
      operationId: api_v1_alerts_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileToken'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileToken'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      tags:
      - api
      requestBody:
