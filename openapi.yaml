        name: payment_method
        schema:
          type: string
          title: Moyen de paiement
          enum:
          - card
          - cash
          - cheque
          - transfer
        description: |-
          * `cash` - Espèces
          * `cheque` - Chèque
          * `transfer` - Virement
          * `card` - Carte
